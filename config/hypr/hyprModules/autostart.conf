#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = dbus-update-activation-environment --systemd --all
exec-once = /usr/lib/hyprpolkitagent/hyprpolkitagent
exec-once = waybar
exec-once = hyprpaper
exec-once = dunst
exec-once = hyprctl setcursor catppuccin-mocha-mauve-cursors 24

# Workaround: recompute monitor layout after all displays settle
# (DP-2 lags HDMI/DP-1 at startup, leaving the cursor clamped to their bounds).
exec-once = sleep 2 && hyprctl reload

#clipboard manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
