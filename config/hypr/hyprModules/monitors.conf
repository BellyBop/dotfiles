################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitorv2 {
    output = HDMI-A-1
    mode = 1920x1080@60
    position = 0x0
    scale = 1
    transform = 1
}

monitorv2 {
    output = DP-1
    mode = 2560x1440@240
    position = 1080x320
    scale = 1
}

monitorv2 {
    output = DP-2
    mode = 2560x1440@144
    position = 3640x320
    scale = 1
}
